purpose: >-
  A private, shareable family tree for one organizer and read-only relatives.
  Commits 01–04 provide the pnpm workspace, web shell, API health endpoint,
  local Supabase setup, pure shared person schemas and family graph rules,
  private family SQL schema, tree-locking PostgreSQL transactions, organizer
  authentication, and owned tree/person endpoints. Relationship endpoints,
  editing screens, photo workflows, sharing, and automatic layout remain
  subsequent work in the PRD commit plan.

tech:
  - TypeScript
  - React
  - Vite
  - Tailwind CSS
  - React Router
  - TanStack Query
  - React Flow (@xyflow/react)
  - ELK.js
  - Fastify
  - Zod
  - Supabase (PostgreSQL, Auth, Storage)
  - Vitest
  - pnpm workspaces

entry_points:
  - apps/web/src/main.tsx
  - apps/api/src/server.ts
  - packages/family-core/src/index.ts

stale_after_commits: 30
