purpose: >-
  A private, shareable family tree for one organizer and read-only relatives.
  Commits 01–14 provide the pnpm workspace, organizer web application, API health endpoint,
  local Supabase setup, pure shared person schemas and family graph rules,
  private family SQL schema, tree-locking PostgreSQL transactions, organizer
  authentication, owned tree/person endpoints, atomic parent/partner mutations,
  authenticated family editing, and an ELK-powered React Flow family map with
  automatic generation layout, contextual rich person cards with family focus navigation,
  verified private portrait uploads with age-bucket galleries, a dedicated route-backed
  life-stage photo viewer, and hash-only private viewer links for account-free read-only
  family browsing. A shared synthetic family,
  local-only additive seed, integrity CI, and PRD-mapped checklist prepare manual acceptance.
  A provider-neutral deployment and operations runbook records the production trust boundaries,
  release gates, hosted migration and private Storage setup, and MVP recovery procedures.
  The editing, tree, card, photo, and viewer screens still await organizer manual QA.

tech:
  - TypeScript
  - React
  - Vite
  - Tailwind CSS
  - React Router
  - TanStack Query
  - React Flow (@xyflow/react)
  - ELK.js
  - Fastify
  - Zod
  - Supabase (PostgreSQL, Auth, Storage)
  - Vitest
  - pnpm workspaces

entry_points:
  - apps/web/src/main.tsx
  - apps/api/src/server.ts
  - packages/family-core/src/index.ts

