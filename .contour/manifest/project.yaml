purpose: >-
  A private, shareable family tree for one organizer and read-only relatives.
  Commit 01 provides the pnpm workspace, web shell, API health endpoint, and
  local Supabase setup. Family schemas, graph validation, authorization,
  photos, and automatic layout remain subsequent work in the PRD commit plan.

tech:
  - TypeScript
  - React
  - Vite
  - Tailwind CSS
  - React Router
  - TanStack Query
  - React Flow (@xyflow/react)
  - ELK.js
  - Fastify
  - Zod
  - Supabase (PostgreSQL, Auth, Storage)
  - Vitest
  - pnpm workspaces

entry_points:
  - apps/web/src/main.tsx
  - apps/api/src/server.ts
  - packages/family-core/src/index.ts

stale_after_commits: 30
