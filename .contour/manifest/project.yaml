purpose: >-
  A private, shareable family tree for one organizer and read-only relatives.
  Commits 01–08 provide the pnpm workspace, organizer web application, API health endpoint,
  local Supabase setup, pure shared person schemas and family graph rules,
  private family SQL schema, tree-locking PostgreSQL transactions, organizer
  authentication, owned tree/person endpoints, atomic parent/partner mutations,
  authenticated family editing, and an ELK-powered React Flow family map with
  automatic generation layout, and contextual rich person cards with family focus navigation.
  The editing, tree, and card screens await organizer manual QA; photo workflows and sharing
  remain subsequent work in the PRD commit plan.

tech:
  - TypeScript
  - React
  - Vite
  - Tailwind CSS
  - React Router
  - TanStack Query
  - React Flow (@xyflow/react)
  - ELK.js
  - Fastify
  - Zod
  - Supabase (PostgreSQL, Auth, Storage)
  - Vitest
  - pnpm workspaces

entry_points:
  - apps/web/src/main.tsx
  - apps/api/src/server.ts
  - packages/family-core/src/index.ts

stale_after_commits: 30
