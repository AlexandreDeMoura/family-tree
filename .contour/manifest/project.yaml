purpose: >-
  A private, shareable family tree. Organizers model people and their
  relationships with enforced graph invariants, attach photos and rich person
  cards, and read the result through an automatic multi-generation layout.

tech:
  - TypeScript
  - React
  - Vite
  - Tailwind CSS
  - React Router
  - TanStack Query
  - React Flow (@xyflow/react)
  - ELK.js
  - Fastify
  - Zod
  - Supabase (PostgreSQL, Auth, Storage)
  - Vitest
  - pnpm workspaces

entry_points:
  - apps/web/src/main.tsx
  - apps/api/src/server.ts
  - packages/family-core/src/index.ts

stale_after_commits: 30
