    - apps/web/src/features/organizer/tree-queries.ts
    - apps/web/src/lib/api.ts
  verified_by: []
  relies_on: [part-web, door-organizer-family-api]
  doors: []
  open_questions:
    - Tree listing, creation feedback, and the empty state await organizer manual QA.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea

- id: door-organizer-family-editor
  name: Family editor page (/organizer/trees/:treeId)
  status: in-progress
  why: Hosts a full-height album family map beneath a compact tree-name and focus header, with contextual person cards and editable private galleries. People and editing tools and private-link sharing open in independently scrolling side panels for one owned tree; dedicated editing routes remain follow-up work.
  code:
    - apps/web/src/features/organizer/FamilyEditorPage.tsx
    - apps/web/src/features/people/
    - apps/web/src/features/tree/
    - apps/web/src/features/photos/
    - apps/web/src/features/sharing/SharePanel.tsx
    - apps/web/src/index.css
    - apps/web/src/lib/api.ts
  verified_by:
    - apps/web/src/features/people/person-form.test.ts
    - apps/web/src/features/people/relationship-form.test.ts
    - apps/web/src/features/people/person-card.test.ts
    - apps/web/src/features/tree/layout-family-graph.test.ts
    - apps/web/src/features/photos/photo-upload.test.ts
  relies_on: [part-web, part-family-core, door-organizer-family-api]
  doors: []
  open_questions:
    - Organizer manual QA must verify editing feedback, map readability, card and gallery behavior, responsive presentation, and value preservation after failed saves.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea

