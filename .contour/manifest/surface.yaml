# Product entry points: browser pages and HTTP endpoint groups. Components that
# live inside a page (family map, person card, photo gallery) are not doors.
- id: door-organizer-sign-in
  name: Organizer sign-in page (/sign-in)
  status: in-progress
  why: Lets the pre-provisioned organizer enter the private workspace with email and password; protected organizer routes send signed-out visitors here and return them to the requested page afterwards.
  code:
    - apps/web/src/App.tsx
    - apps/web/src/features/organizer/SignInPage.tsx
    - apps/web/src/features/organizer/ProtectedRoute.tsx
    - apps/web/src/features/organizer/AuthProvider.tsx
    - apps/web/src/features/organizer/auth-context.ts
    - apps/web/src/lib/supabase.ts
  verified_by: []
  relies_on: [part-web, part-supabase]
  doors: []
  open_questions:
    - Sign-in, session restoration, redirect, and sign-out have no automated coverage and await organizer manual QA.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea

- id: door-organizer-home
  name: Organizer tree list page (/organizer)
  status: in-progress
