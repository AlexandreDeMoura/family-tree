id: contract-private-family-persistence
name: Private family data integrity
status: shipped
part: part-supabase
why: Defines the constrained, default-deny SQL persistence available to upcoming organizer services.
accepts:
  - Family records with UUID identifiers and an existing organizer user.
guarantees:
  - Row constraints reject invalid life statuses, death before birth, living death years, future death years, and malformed or excessive fun facts.
  - Composite foreign keys reject cross-tree relationships and photos; a main photo belongs to the same person and tree.
  - Parent edges are unique and reject self-links; partnerships require canonical distinct UUID pairs and permit multiple partners.
  - Photo records require one supported age bucket and the exact private JPEG path derived from tree, person, and photo IDs.
  - All family tables enable RLS without policies and revoke direct browser-role reads and mutations.
  - Deleting a photo clears its main-photo reference; deleting a person or tree cascades dependent metadata; organizer deletion is restricted while trees exist.
rules:
  - Ancestry cycles, the two-parent limit, and connected birth-year ordering use shared validators in future API services; SQL row constraints alone do not enforce them.
  - No derived siblings, layout artifacts, or sharing secrets are stored in the family tables.
  - Storage provisioning remains on the Storage API and migrations add no public Storage policies; SQL cascades do not delete Storage objects.
code: [supabase/migrations/, supabase/README.md]
verified_by: [apps/api/src/lib/database.db.test.ts]
relies_on: []
doors: []
open_questions:
  - Signed photo operations and Storage cleanup remain for the photo workflow.
