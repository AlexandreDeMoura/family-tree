id: contract-person-card-navigation
name: Graph-derived person cards and contextual focus
status: in-progress
capability: cap-browse-family-tree
why: Promises organizers and relatives that person cards and focus emphasis stay consistent with the authoritative graph while the broader tree remains available for navigation on both the editor and viewer pages.
accepts:
  - An authoritative family graph and a selected person ID contained in that graph.
guarantees:
  - Person cards project parents, children, partners, full siblings, and half-siblings without persisting or inventing relationships.
  - Relationship sections distinguish complete lists, partial knowledge, unknown information, and known empty lists.
  - Sibling completeness depends on known parents and those parents' child-list completeness, while sibling type still depends only on shared known parent IDs.
  - Focus projections include the selected person and card-listed immediate family without mutating or replacing the full family graph.
  - Deceased people retain the same portrait, card, and node prominence as living people; only graph distance from the selected person may fade a node.
  - Available main portraits appear consistently in the sidebar, family map, and person card, while unavailable images fall back without fading the person.
rules:
  - The tree fills the workspace below its compact header; zoom-out, percentage, zoom-in, and fit controls stay in the canvas chrome.
  - Unknown relationship lists use neutral dashed placeholders while known absence stays plain copy.
  - Parents, siblings, partners, and children remain expandable and every listed person can become the next focus.
  - Closing focus returns to the broader tree without changing the organizer's selected editing record.
  - Signed photo access and publication rules belong to the private-photo contract; this contract only consumes authorized short-lived URLs.
code:
  - apps/web/src/features/people/PersonCard.tsx
  - apps/web/src/features/people/person-card.ts
  - apps/web/src/features/tree/FamilyTree.tsx
  - apps/web/src/features/organizer/FamilyEditorPage.tsx
  - apps/web/src/features/sharing/ViewerPage.tsx
  - apps/web/src/index.css
verified_by:
  - apps/web/src/features/people/person-card.test.ts
relies_on: [contract-family-graph, contract-family-tree-layout]
doors: [door-organizer-family-editor, door-private-family-view]
open_questions:
  - Manual UI QA must confirm that the adjacent card leaves enough tree context visible across supported screen sizes on both pages.
