id: contract-organizer-family-editor
name: Organizer family editing experience
status: in-progress
part: part-web
why: Keeps organizer input intact and validates proposed family changes before sending them to the authoritative API.
accepts:
  - A Supabase email and password for the pre-provisioned organizer account.
  - Tree names, complete person form values, and person-specific parent, partner, and child selections.
  - Nullable year fields and completeness choices, including the explicit known, no children, and unknown child states.
guarantees:
  - Organizer routes wait for session restoration and redirect unauthenticated visitors to sign-in.
  - Every family API request carries the current Supabase Bearer access token.
  - Add and edit actions open dedicated route-backed workspaces; save or discard returns to the overview with the relevant person focused.
  - The person draft normalizes optional years and facts, stages parent, partner, and child choices, then validates one proposed graph before submission.
  - Specific fact conflicts block save in a terracotta banner; a live read-only node preview, invariant summary, and non-blocking discovery prompts update from the draft.
  - Siblings remain derived and non-editable, while empty complete child selections remain distinct from unknown or incomplete child information.
  - Failed saves retain the entered draft and show client or server feedback; successful mutations invalidate the affected tree queries.
  - Loading, request failure, no-tree, no-person, and insufficient-people states have explicit organizer-facing treatments.
rules:
  - The frontend improves feedback but never replaces server authorization or authoritative validation.
  - Empty complete relationship lists mean known absence; unchecked completeness means unknown or incomplete.
  - Sibling summaries are derived from the authoritative graph and never persisted by the web application.
code:
  - apps/web/src/App.tsx
  - apps/web/src/features/organizer/
  - apps/web/src/features/people/
  - apps/web/src/lib/api.ts
