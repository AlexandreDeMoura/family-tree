id: contract-tree-transaction
name: Atomic family graph mutation transaction
status: shipped
part: part-api
why: Gives organizer services one serialization boundary for authoritative family graph changes.
accepts:
  - A pooled PostgreSQL client, an existing tree ID, and a server-side work callback.
guarantees:
  - The transaction acquires the tree row lock before invoking the work callback.
  - Successful work commits, failed work rolls back, and the database connection is always released.
  - A connection is discarded rather than returned to the pool when rollback itself fails.
  - A missing tree rejects the transaction before the work callback runs.
rules:
  - Every graph-affecting write must authorize and validate against fresh data inside the locked callback using its supplied client.
  - READ COMMITTED lets a waiting writer read the committed graph after acquiring the tree lock.
  - Tree creation authorizes the organizer before insertion because no tree row exists to lock yet.
