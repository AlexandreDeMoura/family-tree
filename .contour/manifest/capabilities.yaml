# Bounded user tasks of the family organizer and the casual relative (PRD §5).
# Every entry stays in-progress until the PRD §24 manual acceptance record in
# docs/manual-acceptance.md passes; automated checks alone do not ship a capability.
- id: cap-manage-family-trees
  name: Create family trees and open one to work on
  status: in-progress
  why: >-
    A family organizer can sign in with the single pre-provisioned account, see the
    trees they own, create a new named tree, and open one in the editor. Sign-in and
    sign-out are the access context of this ability, not separate tasks. Adding
    relatives, connecting them, photos, and sharing belong to other abilities. The
    current product has no tree rename or deletion.
  code:
    - apps/api/src/features/auth/
    - apps/api/src/features/trees/
    - apps/api/src/features/organizer.routes.ts
    - apps/api/src/features/organizer.schemas.ts
    - apps/web/src/App.tsx
    - apps/web/src/features/organizer/AuthProvider.tsx
    - apps/web/src/features/organizer/auth-context.ts
    - apps/web/src/features/organizer/ProtectedRoute.tsx
    - apps/web/src/features/organizer/SignInPage.tsx
    - apps/web/src/features/organizer/OrganizerHomePage.tsx
    - apps/web/src/features/organizer/OrganizerHeader.tsx
    - apps/web/src/features/organizer/tree-queries.ts
    - apps/web/src/lib/api.ts
    - apps/web/src/lib/supabase.ts
  verified_by:
    - apps/api/src/organizer-api.test.ts
    - apps/api/src/lib/database.db.test.ts
  relies_on: [part-web, part-api, part-supabase]
  doors: [door-organizer-sign-in, door-organizer-home, door-organizer-family-editor, door-organizer-family-api]
  review_instructions:
    - summary: >-
        Open an organizer tree URL while signed out, sign in with the configured
        organizer, and confirm you return to that tree; refresh to confirm the session is restored.
    - summary: >-
        From the organizer home, create a named tree and confirm its empty editor opens;
        return home and switch between it and an existing tree, checking the correct name and people.
      source:
        path: docs/manual-acceptance.md
        section: Creation and integrity — PRD §24 Creation and Data integrity
    - summary: >-
        Try a blank tree name and a failed tree request; confirm blank creation is
        blocked, failures show feedback, and retrying the tree list restores access.
    - summary: >-
        Sign out, then revisit the organizer home and a saved editor URL; both must
        require sign-in before showing private family data.
  open_questions:
    - Organizer manual QA must confirm sign-in, redirect back to the requested page, the tree list, tree creation, and sign-out.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea

- id: cap-edit-relatives
  name: Create and edit a relative in a selected family tree
  status: in-progress
  why: >-
    A family organizer can add a person to the open tree and later edit their names,
    life status, birth and death years, adoption flag, up to three fun facts, and
    whether their parent, partner, and child lists are known to be complete. Invalid
    life data and edits that would break a connected parent or child are refused
    before anything is saved, and unknown values stay distinct from known absence.
    Add and edit use dedicated workspaces with a live viewer-facing preview, rule
    summary, and non-blocking completion prompts. Fields and validation messages are details of this task. Connecting people and
    managing photos are separate abilities. Deleting a relative does not exist in the
    current product.
  code:
    - packages/family-core/src/schemas.ts
    - packages/family-core/src/person.ts
    - packages/family-core/src/invariants.ts
    - supabase/migrations/20260909000000_create_family_schema.sql
    - apps/api/src/features/people/
    - apps/api/src/features/organizer.routes.ts
    - apps/api/src/features/organizer.schemas.ts
    - apps/web/src/features/people/person-form.ts
    - apps/web/src/features/people/person-workspace.ts
    - apps/web/src/features/organizer/PersonWorkspacePage.tsx
    - apps/web/src/lib/api.ts
  verified_by:
    - packages/family-core/src/person.test.ts
    - apps/api/src/organizer-api.test.ts
    - apps/api/src/lib/database.db.test.ts
    - apps/web/src/features/people/person-form.test.ts
    - apps/web/src/features/people/person-workspace.test.ts
  relies_on: [part-web, part-api, part-family-core, part-supabase]
  doors: [door-organizer-family-editor, door-organizer-family-api]
  review_instructions:
    - summary: >-
        Add a relative, then edit their names, life status, optional years, adoption,
        and up to three facts; save and refresh to confirm the card retains the changes.
      source:
        path: docs/manual-acceptance.md
        section: Dedicated person workspace follow-up — PRD commit 15 (manual QA pending)
    - summary: >-
        Try death before birth, a future death year, and switching a deceased person
        with a death year to Living; confirm invalid combinations cannot be saved and unknown years remain valid.
      source:
        path: docs/manual-acceptance.md
        section: Creation and integrity — PRD §24 Creation and Data integrity
    - summary: >-
        Edit a connected person's birth year to conflict with a parent or child;
        confirm a specific rule blocks save, retains the draft, and leaves persisted facts unchanged after reload.
      source:
        path: docs/manual-acceptance.md
        section: Creation and integrity — PRD §24 Creation and Data integrity
    - summary: >-
        Save unknown and complete parent/partner lists, plus known children, No children,
        and Unknown; reopen the person and confirm each state survives with distinct tree/card wording.
      source:
        path: docs/manual-acceptance.md
        section: Dedicated person workspace follow-up — PRD commit 15 (manual QA pending)
    - summary: >-
        Confirm the live preview follows fact edits and missing-information prompts
        allow save; save should focus the person, while discard leaves facts and relationships unchanged.
      source:
        path: docs/manual-acceptance.md
        section: Dedicated person workspace follow-up — PRD commit 15 (manual QA pending)
    - summary: >-
        Simulate a failed save and confirm all draft values remain available; compare
        the editor with mockup 04 and check that fields, actions, and the preview remain reachable at narrow widths.
      source:
        path: docs/manual-acceptance.md
        section: Dedicated person workspace follow-up — PRD commit 15 (manual QA pending)
  open_questions:
    - Organizer manual QA must confirm creation, editing, specific blocked-rule messages, retained values after a failed save, and the unknown-versus-known-absence controls.
    - Whether removing a relative belongs to the MVP is unresolved; see attention-relative-deletion-scope.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea

- id: cap-connect-family-members
  name: Connect relatives as parents, children, or partners
  status: in-progress
  why: >-
    A family organizer can add or remove a parent-to-child link or a partnership
    between two people in the open tree, including multiple partners and children
    with one known parent, and see the full and half siblings derived from shared
    parents. Links that would create an ancestry cycle, a third parent, a parent
    younger than the child, a duplicate, or a self-link are refused before anything
    is saved. The dedicated person workspace stages all incident relationships with
    person facts and saves the valid snapshot atomically. Siblings are never entered directly.
  code:
    - packages/family-core/src/graph.ts
    - packages/family-core/src/invariants.ts
    - packages/family-core/src/relationships.ts
    - supabase/migrations/20260909000000_create_family_schema.sql
    - apps/api/src/features/relationships/
    - apps/api/src/features/organizer.routes.ts
    - apps/api/src/features/organizer.schemas.ts
    - apps/web/src/features/people/relationship-form.ts
    - apps/web/src/features/people/person-workspace.ts
    - apps/web/src/features/organizer/PersonWorkspacePage.tsx
    - apps/web/src/lib/api.ts
  verified_by:
    - packages/family-core/src/graph.test.ts
    - packages/family-core/src/relationships.test.ts
    - apps/api/src/lib/database.db.test.ts
    - apps/api/src/organizer-api.test.ts
    - apps/web/src/features/people/relationship-form.test.ts
    - apps/web/src/features/people/person-workspace.test.ts
  relies_on: [part-web, part-api, part-family-core, part-supabase]
  doors: [door-organizer-family-editor, door-organizer-family-api]
  review_instructions:
    - summary: >-
        Add and remove parent, child, and partner selections in a person's workspace;
        save and reload to confirm the links change together with person facts and unrelated branches stay unchanged.
      source:
        path: docs/manual-acceptance.md
        section: Dedicated person workspace follow-up — PRD commit 15 (manual QA pending)
    - summary: >-
        In the synthetic acceptance tree, confirm Luc has both Claire and Nadia as
        partners, Mia remains valid with one known parent, and Sam remains valid while disconnected.
      source:
        path: docs/manual-acceptance.md
        section: Creation and integrity — PRD §24 Creation and Data integrity
    - summary: >-
        Confirm Anne has nine full siblings and Theo is marked as a half-sibling;
        changing shared parents must update the derived summary without offering direct sibling editing.
      source:
        path: docs/manual-acceptance.md
        section: Creation and integrity — PRD §24 Creation and Data integrity
    - summary: >-
        Try an ancestry loop, a third parent, and a parent born after their child;
        each must show a specific conflict and block save, while equal or unknown birth years remain valid.
      source:
        path: docs/manual-acceptance.md
        section: Creation and integrity — PRD §24 Creation and Data integrity
    - summary: >-
        Confirm relationship choices prevent self-links and duplicates; simulate a
        failed save and verify selections remain in the draft while reloading shows no partial relationship changes.
      source:
        path: docs/manual-acceptance.md
        section: Dedicated person workspace follow-up — PRD commit 15 (manual QA pending)
  open_questions:
    - Organizer manual QA must confirm adding and removing links, the derived sibling summary, and actionable conflict messages for each invariant.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea

- id: cap-browse-family-tree
  name: Explore all relatives of a selected family tree on a canvas
  status: in-progress
  why: >-
    A family organizer in the editor, or a casual relative holding a private link,
    can see every person of a tree laid out automatically by generation, pan and
    zoom to reach large or distant branches, focus on one person while the
    surrounding tree stays visible, open that person's card to read life details,
    fun facts, adoption and remembrance indicators, open a dedicated life-stage photo
    viewer from a compact card preview, browse every age bucket in life order, and step
    to any listed parent, sibling, partner, or child. Photo-viewer navigation retains
    the selected person's card or returns to the whole tree. Unknown
    information reads as incomplete rather than broken, half siblings are marked,
    and deceased relatives keep equal prominence. The organizer and viewer use a
    full-height album workspace with compact portrait cards, a visible zoom percentage,
    zoom and fit controls, and a tree-name and focus header. Unknown leaf branches
    use neutral dashed cues; confirmed childlessness reads as plain No children copy.
    Pan, zoom, focus, and the card
    are details of this one exploration task; obtaining the link belongs to
    sharing, and adding photos or facts belongs to the organizer editing abilities.
  code:
    - apps/web/src/features/tree/
    - apps/web/src/features/people/PersonCard.tsx
    - apps/web/src/features/people/person-card.ts
    - apps/web/src/features/photos/
    - apps/web/src/features/organizer/FamilyEditorPage.tsx
    - apps/web/src/features/sharing/ViewerPage.tsx
    - apps/web/src/index.css
    - packages/family-core/src/relationships.ts
    - apps/api/src/features/trees/
    - apps/api/src/features/sharing/sharing.service.ts
  verified_by:
    - apps/web/src/features/tree/layout-family-graph.test.ts
    - apps/web/src/features/tree/tree-person.test.ts
    - apps/web/src/features/people/person-card.test.ts
    - apps/web/src/features/photos/life-stage-gallery.test.ts
    - apps/web/src/features/sharing/share-link.test.ts
    - packages/family-core/src/relationships.test.ts
    - packages/family-core/src/mvp-acceptance.fixture.test.ts
  relies_on: [part-web, part-api, part-family-core, part-supabase]
  doors: [door-organizer-family-editor, door-private-family-view]
  review_instructions:
    - summary: >-
        Open the synthetic acceptance tree in both organizer and private viewer;
        confirm every person appears once, generations run top-to-bottom, and Luc's two partner branches remain understandable.
      source:
        path: docs/manual-acceptance.md
        section: Visual design — PRD §24 Visual design
    - summary: >-
        Pan, zoom, and fit the tree on desktop and narrow screens; reach the ten-sibling
        branch and disconnected Sam, with the tree name, focus header, and live zoom controls still usable.
      source:
        path: docs/manual-acceptance.md
        section: Album workspace follow-up — PRD commit 13 (manual QA pending)
    - summary: >-
        Focus Anne, follow each parent, sibling, partner, and child from her card,
        then choose Show whole tree; confirm each correct person opens and enough tree context remains visible.
      source:
        path: docs/manual-acceptance.md
        section: Browsing — PRD §24 Browsing
    - summary: >-
        Check names, life details, adoption, three facts, Half labels, and missing-photo
        placeholders; unknown relationships must look incomplete and confirmed childlessness must say No children.
      source:
        path: docs/manual-acceptance.md
        section: Album workspace follow-up — PRD commit 13 (manual QA pending)
    - summary: >-
        Compare whole-tree and focused views with mockups 01 and 02; deceased relatives
        must retain equal card size and prominence, with a subtle remembrance ring and fading based only on focus distance.
      source:
        path: docs/manual-acceptance.md
        section: Album workspace follow-up — PRD commit 13 (manual QA pending)
    - summary: >-
        From a private viewer card, open the photo preview and browse all eleven life
        stages in order; verify bucket counts, thumbnail selection, quiet empty stages, and unavailable-image refresh.
      source:
        path: docs/manual-acceptance.md
        section: Life-stage photo viewer follow-up — PRD commit 14 (manual QA pending)
    - summary: >-
        Compare the photo page with mockup 03 using portrait, landscape, and square
        images at desktop and narrow widths; Back to card must restore the same person and close must return to the whole tree.
      source:
        path: docs/manual-acceptance.md
        section: Life-stage photo viewer follow-up — PRD commit 14 (manual QA pending)
  open_questions:
    - Manual QA must compare whole-tree and focused-person album workspaces with mockups 01 and 02, including compact nodes, remembrance rings, discovery cues, visible zoom controls, and responsive behavior.
    - Manual QA must confirm that multiple-partner, half-sibling, ten-sibling, and disconnected branches stay readable with pan, zoom, and fit-to-view on desktop and narrow screens.
    - Manual QA must confirm that focus and the overlaid card leave enough tree context for an unfamiliar relative to understand a branch on both the organizer and viewer pages.
    - Manual QA must compare the dedicated life-stage photo viewer with mockup 03 and confirm real-image fitting on desktop and narrow screens.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea

- id: cap-manage-relative-photos
  name: Add, categorize, and remove a relative's private photos
  status: in-progress
  why: >-
    A family organizer can upload a JPEG, PNG, or WebP photo of a person in the open
    tree, assign it to exactly one life-stage bucket, choose which published photo is
    the person's main portrait shown on the map, editing preview, and card, refresh expired
    private links, retry cleanup of an unfinished upload, and remove a photo. Photos
    stay in one private bucket and become visible only after the server verifies the
    uploaded object. Browsing the gallery by life stage belongs to exploration; fun
    facts belong to relative editing.
  code:
    - packages/family-core/src/photos.ts
    - supabase/migrations/20260909000000_create_family_schema.sql
    - apps/api/src/features/photos/
    - apps/api/src/lib/photo-storage.ts
    - apps/api/src/features/organizer.routes.ts
    - apps/api/src/features/organizer.schemas.ts
    - apps/web/src/features/photos/
    - apps/web/src/features/organizer/PersonWorkspacePage.tsx
    - apps/web/src/lib/api.ts
  verified_by:
    - apps/api/src/photos-api.test.ts
    - apps/api/src/lib/database.db.test.ts
    - apps/web/src/features/photos/photo-upload.test.ts
  relies_on: [part-web, part-api, part-family-core, part-supabase]
  doors: [door-organizer-family-editor, door-organizer-family-api]
  review_instructions:
    - summary: >-
        Save a person before adding photos, then upload JPEG, PNG, and WebP examples
        across all eleven life stages; reload and confirm each published photo appears only in its chosen bucket.
      source:
        path: docs/manual-acceptance.md
        section: Browsing — PRD §24 Browsing
    - summary: >-
        Choose a published photo as the main portrait, refresh, then remove it;
        confirm the map, editing preview, and person card update and use a clean fallback after deletion.
      source:
        path: docs/manual-acceptance.md
        section: Browsing — PRD §24 Browsing
    - summary: >-
        Let a private photo URL expire and use Refresh links to restore the image;
        a missing object must show Photo unavailable and leave refresh or removal accessible.
    - summary: >-
        Try an unsupported file and a source larger than 20 MiB; confirm useful
        feedback and no published photo, then retry with a valid image and confirm it appears once.
    - summary: >-
        Interrupt an upload or deletion in the local acceptance tree; confirm the
        failure is visible and, when cleanup remains pending, its retry control clears it without publishing an unfinished upload.
  open_questions:
    - Organizer manual QA must confirm browser conversion, signed upload for every bucket, portrait selection and fallback, expired-link refresh, missing-image treatment, and deletion retry.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea

- id: cap-share-family-tree
  name: Create a private link for relatives to view a tree without an account
  status: in-progress
  why: >-
    A family organizer can create, copy, and later replace one unlisted link for the
    open tree, and a casual relative who receives it can open the tree in a read-only
    view without signing in. Replacing the link immediately stops the old one from
    working, and the product states that anyone holding the link can view the tree.
    Link creation and recipient access are steps of this one task; what the relative
    does inside the opened tree is the exploration ability.
  code:
    - supabase/migrations/20260910000000_add_tree_share_links.sql
    - apps/api/src/features/sharing/
    - apps/api/src/app.ts
    - apps/web/src/App.tsx
    - apps/web/index.html
    - apps/web/src/features/sharing/
    - apps/web/src/features/organizer/FamilyEditorPage.tsx
    - apps/web/src/lib/api.ts
  verified_by:
    - apps/api/src/sharing-api.test.ts
    - apps/api/src/lib/database.db.test.ts
    - apps/web/src/features/sharing/share-link.test.ts
  relies_on: [part-web, part-api, part-supabase, cap-browse-family-tree]
  doors: [door-organizer-family-editor, door-organizer-family-api, door-private-family-view, door-viewer-family-api]
  review_instructions:
    - summary: >-
        Create and copy a private link from Share tree; confirm the privacy copy
        explains that anyone holding the link can view the tree and forward it.
      source:
        path: docs/manual-acceptance.md
        section: Browsing — PRD §24 Browsing
    - summary: >-
        Open the copied link in a signed-out window; confirm the correct tree,
        cards, facts, and private photos load without an account and no editing, upload, or sharing controls appear.
      source:
        path: docs/manual-acceptance.md
        section: Browsing — PRD §24 Browsing
    - summary: >-
        Navigate between the private tree, card, and photo page, then refresh and
        use browser back/forward; access must survive with the token kept in the URL fragment.
      source:
        path: docs/manual-acceptance.md
        section: Life-stage photo viewer follow-up — PRD commit 14 (manual QA pending)
    - summary: >-
        Replace the link, then reload the old tree and photo-page URLs; both must
        refuse access while the new link works. Previously issued image URLs may remain usable until their five-minute expiry.
      source:
        path: docs/manual-acceptance.md
        section: Life-stage photo viewer follow-up — PRD commit 14 (manual QA pending)
    - summary: >-
        Open a link with its token missing or altered, and try the token with a
        different tree ID; confirm an unavailable-link state without exposing family data.
  open_questions:
    - Organizer manual QA must confirm link creation, copying, replacement, the privacy caveat, and account-free read-only loading in a signed-out window.
  last_verified: 332c68d3c627499807c461534c2628b3a51b45ea
