- id: decision-private-sql-boundary
  name: Deny browser SQL access and serialize graph mutations per tree
  status: shipped
  why: Revoked browser grants plus RLS with no policies keep family access on Fastify; one READ COMMITTED tree-row lock lets person and relationship services authorize and validate fresh graphs atomically using plain pg.
